name: CI

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  python:
    name: Python (engine + host input agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest evdev
      - name: Run tests
        run: |
          set +e
          python -m pytest -q -rfE --tb=short 2>&1 | tee pytest.out
          code=${PIPESTATUS[0]}
          # Publish failures as annotations so they are visible in the run summary (and through the API)
          grep -E "^(FAILED|ERROR) " pytest.out | head -20 | while IFS= read -r line; do echo "::error title=pytest failure::${line}"; done
          grep -E "^E  " pytest.out | head -25 | while IFS= read -r line; do echo "::error title=pytest detail::${line}"; done
          exit $code

  kotlin:
    name: Phone library (Kotlin, against the real host agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test mesh-core (includes the live test against mesh_input.py)
        working-directory: android
        env:
          MESH_REQUIRE_INTEGRATION: "1"   # a missing python3/openssl must fail, not silently skip the live tests
        run: gradle :mesh-core:test --stacktrace
      - name: Report what actually ran
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for f in glob.glob("android/mesh-core/build/test-results/test/*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); failed += int(r.get("failures", 0)) + int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
              for case in r.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      print("::error title=Kotlin test failed::%s.%s" % (case.get("classname"), case.get("name")))
          print("::notice title=mesh-core tests::%d run, %d failed, %d skipped" % (total, failed, skipped))
          PY
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-core-test-reports
          path: android/mesh-core/build/reports/tests/test/

  android:
    name: Mesh app (Android build + keyboard tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app and run the input-ui tests
        working-directory: android
        run: |
          set +e
          gradle :input-ui:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          # Publish compile and build errors as annotations (the raw log is not downloadable everywhere)
          grep -E "^e: |error:|What went wrong|Execution failed|AAPT|Unresolved reference" -A2 build.log | head -9 | while IFS= read -r l; do echo "::error title=build::${l//%/%25}"; done
          exit $code
      - name: Upload the APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-debug
          path: android/app/build/outputs/apk/debug/*.apk
